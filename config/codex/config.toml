model = "gpt-6.1-sol"
model_reasoning_effort = "low"

sandbox_mode = "danger-full-access"

service_tier = "default"
approvals_reviewer = "user"
approval_policy = "never"

[model_providers.ollama-launch]
name = "Ollama"
base_url = "https://gateway.ai.cloudflare.com/v1/52c96a2ff3d6f958e49a8bbd1cf3553f/example-gateway/custom-example"
env_key = "SPARK_OLLAMA_API_KEY"

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "model",
    "git-branch",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
    "used-tokens",
    "total-input-tokens",
    "total-output-tokens",
    "fast-mode",
    "task-progress",
]

[plugins."github@openai-curated"]
enabled = true

[plugins."cloudflare@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[mcp_servers.playwright]
command = "pnpm"
args = ["dlx", "@playwright/mcp@latest"]

[mcp_servers.chrome_devtools]
command = "pnpm"
args = ["dlx", "chrome-devtools-mcp@latest", "--autoConnect"]

[mcp_servers.openai_developer_docs]
url = "https://developers.openai.com/mcp"

[mcp_servers.hono-docs-mcp]
url = "https://hono-docs-mcp.yusukebe.workers.dev/mcp"

[mcp_servers.tgs_2026]
enabled = true
url = "https://tgs-2026-mcp.km3.workers.dev/mcp"

# [mcp_servers.cloudflare]
# url = "https://mcp.cloudflare.com/mcp"
#
# [mcp_servers.cloudflare-docs]
# url = "https://docs.mcp.cloudflare.com/mcp"
#
# [mcp_servers.cloudflare-bindings]
# url = "https://bindings.mcp.cloudflare.com/mcp"
#
# [mcp_servers.cloudflare-builds]
# url = "https://builds.mcp.cloudflare.com/mcp"
#
# [mcp_servers.cloudflare-observability]
# url = "https://observability.mcp.cloudflare.com/mcp"

# NOTE: Feature Flags
# See: https://developers.openai.com/codex/config-basic#feature-flags
[features]
# ChatGPT Apps/connectors support
apps = true

# Codex-generated git commits and commit attribution trailers
# 2026-05-16: experimental
codex_git_commit = false

# Lifecycle hooks from `hooks.json` or inline `[hooks]`
# See: https://developers.openai.com/codex/hooks
hooks = true

# Plugin-bundled Hooks
# https://developers.openai.com/codex/hooks#plugin-bundled-hooks
plugin_hooks = false

# Fast mode selection and the `service_tier = "fast"` path
fast_mode = true

# https://developers.openai.com/codex/memories
memories = false

# Enable subagent collaboration tools
multi_agent = true

# Enable personality selection controls
personality = true

# Snapshot your shell environment to speed up repeated commands
shell_snapshot = true

# Enable the default shell tool
shell_tool = true

# Use the unified PTY-backend exec tool
unified_exec = true

# Undo via per-turn git ghost snapshot
undo = true
js_repl = false
