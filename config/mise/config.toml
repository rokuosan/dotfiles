[tasks]
hello = "echo hello from mise"

[shell_alias]
p = "pnpm"
g = "git"
today = 'date "+%Y-%m-%d"'
todaydir = 'mkdir -p $(date "+%Y-%m-%d")'

[tools]
bat = "latest"
deno = "latest"
fd = "latest"
gh = "latest"
"github:k1LoW/mo" = "latest"
"github:qpdf/qpdf" = "12.3.1"
"github:rokuosan/git-wtclean" = "v0.1.0"
go = "latest"
"go:github.com/fujimura/git-gsub" = "latest"
"go:github.com/k1LoW/git-wt" = "latest"
"go:github.com/rokuosan/qrg" = "v0.4.0"
herdr = "latest"
java = "26.0.0"
lazygit = "latest"
node = "24"
"npm:@helpfeel/cosense-cli" = "latest"
"npm:@openai/codex" = "latest"
opencode = "latest"
ripgrep = "latest"
perl = "5.42.0"
usage = "latest"
uv = "latest"
watchexec = "latest"
fzf = "latest"
zoxide = "latest"
task = "latest"
peco = "latest"
pnpm = "latest"
ghq = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
claude = "latest"

[settings]
experimental = true

trusted_config_paths = [
'~/repo/github.com/rokuosan',
'~/repo/github.com/yaken-org/',
'~/repo/github.com/wsoft-ws/',
]

minimum_release_age = "24h"
minimum_release_age_excludes = ["npm:@helpfeel/cosense-cli"]

[settings.github]
credential_command = "gh auth token --hostname github.com"
