[tools]
lua = "latest"

[dotfiles]
"~/bin" = { source = "bin" }

"~/.zshrc" = { source = "config/zsh/.zshrc" }
"~/.zprofile" = { source = "config/zsh/.zprofile" }
"~/.config/zsh" = { source = "config/zsh" }

"~/.agents/skills/apple-container" = { source = "agents/skills/apple-container" }
"~/.agents/skills/japanese-tech-writing" = { source = "agents/skills/japanese-tech-writing" }
"~/.agents/skills/untangle-codebase" = { source = "agents/skills/untangle-codebase" }
"~/.claude/skills/apple-container" = { source = "agents/skills/apple-container" }
"~/.claude/skills/japanese-tech-writing" = { source = "agents/skills/japanese-tech-writing" }
"~/.claude/skills/untangle-codebase" = { source = "agents/skills/untangle-codebase" }
"~/.claude/settings.json" = { source = "config/claude/settings.json", mode = "copy", create_if_missing = true }
"~/.codex/config.toml/shared" = { source = "config/codex/config.toml", merge = true }

"~/.config/1Password" = { source = "config/1Password" }
"~/.config/gh" = { source = "config/gh" }
"~/.config/ghostty" = { source = "config/ghostty" }
"~/.config/git" = { source = "config/git" }
"~/.config/herdr/config.toml" = { source = "config/herdr/config.toml" }
"~/.config/mise/config.toml" = { source = "config/mise/config.toml" }
"~/.config/mise/tasks" = { source = "scripts/tasks" }
"~/.config/nvim" = { source = "config/nvim" }
"~/.config/peco" = { source = "config/peco" }
"~/.config/pnpm" = { source = "config/pnpm" }
"~/.config/starship" = { source = "config/starship" }
"~/.config/wezterm" = { source = "config/wezterm" }

[tasks."setup:brew"]
description = "Install Homebrew and packages from Brewfile"
dir = "{{ config_root }}"
run = "bash scripts/install/homebrew.sh"

[tasks."setup:skills"]
description = "Install or refresh external skills for Codex and Claude Code"
run = [
  "npx --yes skills add cloudflare/skills --global --agent codex claude-code --skill '*' --copy --yes",
  "npx --yes skills add helpfeel/cosense-cli --global --agent codex claude-code --skill cosense --copy --yes",
]

[tasks."setup:herdr:claude"]
description = "Generate the Claude Code integration using Herdr"
run = "herdr integration install claude"
